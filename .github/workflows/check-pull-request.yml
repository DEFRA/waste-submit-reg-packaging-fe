name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  # Builds the PR's code into an image and runs waste-submit-journey-tests against it in Docker Compose.
  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the action's Docker Hub login assumes this repo's CDP build role
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the PR's image
        run: docker build --tag defradigital/waste-submit-reg-packaging-fe:${{ github.sha }} .

      - name: Run the journey tests
        uses: DEFRA/waste-submit-journey-tests/run-journey-tests@main
        with:
          waste-submit-reg-packaging-fe: ${{ github.sha }}

  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-frontend-template .
          exit $?

